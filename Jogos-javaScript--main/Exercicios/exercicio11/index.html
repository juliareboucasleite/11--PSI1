<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 11 - Verificar Número</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }
        
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }
        
        h1 {
            font-size: 1.6rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        input[type="number"] {
            padding: 12px;
            font-size: 1rem;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
        }
        
        button {
            padding: 12px 24px;
            font-size: 1rem;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .result {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #444;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Verificar Número</h1>
        <input type="number" id="numero" placeholder="Digite um número" />
        <button onclick="verificarNumero()">Verificar</button>
        <p class="result" id="resultado"></p>
    </div>

    <script>
        function verificarNumero() {
            const numero = parseInt(document.getElementById('numero').value);
            const resultado = document.getElementById('resultado');

            if (isNaN(numero)) {
                resultado.innerHTML = 'Por favor, digite um número válido.';
            } else if (numero > 0) {
                resultado.innerHTML = `O número <strong>${numero}</strong> é <span style="color: green;">positivo</span>.`;
            } else if (numero < 0) {
                resultado.innerHTML = `O número <strong>${numero}</strong> é <span style="color: red;">negativo</span>.`;
            } else {
                resultado.innerHTML = 'O número é <strong>zero</strong>.';
            }
        }
    </script>
</body>

</html>
