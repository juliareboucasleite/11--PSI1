<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 16 - Nota Qualitativa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 90%;
        }
        
        h1 {
            font-size: 1.6rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        p {
            font-size: 1rem;
            margin-bottom: 20px;
            color: #555;
        }
        
        input[type="number"] {
            padding: 12px;
            font-size: 1rem;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 12px;
        }
        
        button {
            padding: 12px 24px;
            font-size: 1rem;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .result {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #444;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Nota Qualitativa</h1>
        <p>Digite a nota quantitativa:</p>
        <input type="number" id="nota" placeholder="Nota (0 a 20)" min="0" max="20" step="0.1" />
        <button onclick="avaliarNota()">Ver Nota Qualitativa</button>
        <p class="result" id="resultado"></p>
    </div>

    <script>
        function avaliarNota() {
            const nota = parseFloat(document.getElementById('nota').value);
            const resultado = document.getElementById('resultado');

            if (isNaN(nota) || nota < 0 || nota > 20) {
                resultado.innerHTML = '⚠️ Por favor, insira uma nota válida entre 0 e 20.';
                return;
            }

            let qualitativa = '';
            if (nota > 0 && nota <= 5) {
                qualitativa = 'Muito insuficiente';
            } else if (nota > 5 && nota <= 9.5) {
                qualitativa = 'Insuficiente';
            } else if (nota > 9.5 && nota <= 14) {
                qualitativa = 'Suficiente';
            } else if (nota > 14 && nota <= 16) {
                qualitativa = 'Bom';
            } else if (nota > 16 && nota <= 20) {
                qualitativa = 'Muito bom';
            }

            resultado.innerHTML = `Nota qualitativa: <strong>${qualitativa}</strong>`;
        }
    </script>
</body>

</html>
