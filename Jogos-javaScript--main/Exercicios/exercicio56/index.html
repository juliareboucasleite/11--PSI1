<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exercício 56 - Tabela 3x3</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--card-bg, #fff);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px;
            color: var(--text, #333);
            text-align: center;
        }
        
        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg, #fff);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }
        
        h1 {
            margin-bottom: 25px;
        }
        
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 70%;
            max-width: 350px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }
        
        th,
        td {
            border: 1px solid #ccc;
            padding: 20px;
            text-align: center;
            font-size: 1.1rem;
            background: white;
        }
        
        label {
            font-weight: 600;
            margin: 0 5px 15px 0;
            display: inline-block;
            color: var(--text, #333);
        }
        
        input[type=number],
        input[type=text] {
            padding: 10px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            width: 80px;
            margin-right: 10px;
            box-sizing: border-box;
        }
        
        button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
            width: 100%;
            max-width: 250px;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Tabela 3x3</h1>
        <table id="tabela">
            <tr>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </table>

        <div>
            <label for="linha">Linha (1-3):</label>
            <input type="number" id="linha" min="1" max="3" placeholder="1" />
            <label for="coluna">Coluna (1-3):</label>
            <input type="number" id="coluna" min="1" max="3" placeholder="1" />
            <label for="texto">Texto:</label>
            <input type="text" id="texto" placeholder="Texto" />
        </div>

        <button onclick="adicionarTexto()">Adicionar Texto</button>
    </div>

    <script>
        function adicionarTexto() {
            const linha = parseInt(document.getElementById('linha').value) - 1;
            const coluna = parseInt(document.getElementById('coluna').value) - 1;
            const texto = document.getElementById('texto').value.trim();

            if (linha < 0 || linha > 2 || coluna < 0 || coluna > 2) {
                alert("Por favor, insira um número de linha e coluna válido (1-3).");
                return;
            }
            if (!texto) {
                alert("Por favor, insira algum texto.");
                return;
            }

            const tabela = document.getElementById('tabela');
            if (tabela.rows[linha].cells[coluna].innerText !== '') {
                alert("A célula já contém texto. Escolha outra célula.");
                return;
            }

            tabela.rows[linha].cells[coluna].innerText = texto;

            document.getElementById('linha').value = '';
            document.getElementById('coluna').value = '';
            document.getElementById('texto').value = '';
        }
    </script>
</body>

</html>
