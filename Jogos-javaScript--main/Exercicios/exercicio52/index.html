<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exercício 52 - Conversão Decimal para Binário</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        
        input[type=number] {
            width: 95%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        
        button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .output {
            margin-top: 20px;
            font-weight: 600;
            color: #444;
            word-wrap: break-word;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Conversão de Decimal para Binário</h1>
        <input type="number" id="inputDecimal" placeholder="Digite um número decimal" />
        <button onclick="converterDecimalParaBinario()">Converter</button>
        <div class="output" id="resultado"></div>
    </div>

    <script>
        function converterDecimalParaBinario() {
            const numeroDecimal = parseInt(document.getElementById('inputDecimal').value);
            if (isNaN(numeroDecimal) || numeroDecimal < 0) {
                document.getElementById('resultado').innerHTML = '<strong style="color: red;">Por favor, insira um número decimal válido.</strong>';
                return;
            }
            const numeroBinario = numeroDecimal.toString(2);
            document.getElementById('resultado').innerHTML = `Número binário: <strong>${numeroBinario}</strong>`;
        }
    </script>
</body>

</html>
