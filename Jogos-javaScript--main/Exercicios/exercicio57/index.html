<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Exercício 57 - Dimensões e Coordenadas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            margin: 40px 20px;
            height: 100vh;
            position: relative;
        }
        
        h1 {
            margin-bottom: 15px;
            color: #2c3e50;
        }
        
        .info {
            font-size: 1.3rem;
            margin-bottom: 20px;
            color: #444;
        }
        
        .area {
            height: 70vh;
            border: 2px dashed #adadad;
            margin: 0 auto;
            max-width: 600px;
            position: relative;
            background-color: #fafafa;
        }
        
        .overlay {
            position: absolute;
            color: purple;
            font-weight: bold;
            pointer-events: none;
            top: 10px;
            left: 10px;
            font-size: 1.2rem;
        }
    </style>
</head>

<body onload="getSize()" onresize="getSize()" onmousemove="showCoordinates(event)">
    <h1>Dimensões da Janela</h1>
    <div class="info" id="dimensoes"></div>
    <div class="area">
        <div class="overlay" id="coordenadas">Coordenadas do Mouse: X: 0, Y: 0</div>
    </div>

    <script>
        function getSize() {
            const largura = window.innerWidth;
            const altura = window.innerHeight;
            document.getElementById('dimensoes').innerText = `Largura: ${largura}px, Altura: ${altura}px`;
        }

        function showCoordinates(event) {
            const x = event.pageX;
            const y = event.pageY;
            const coordenadasDiv = document.getElementById('coordenadas');
            coordenadasDiv.innerHTML = `X: ${x}px, Y: ${y}px`;
        }
    </script>
</body>

</html>
