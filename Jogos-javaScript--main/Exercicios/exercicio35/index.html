<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 35 - Manipulação de Nome</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            flex-direction: column;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: left;
        }
        
        input[type=text] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        
        button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .result {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #444;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <h1>Manipulação de Nome</h1>
    <div class="container">
        <input type="text" id="nomeInput" placeholder="Digite seu nome" />
        <button onclick="processarNome()">Processar Nome</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        function processarNome() {
            const nome = document.getElementById('nomeInput').value.trim();
            const resultDiv = document.getElementById('result');
            if (!nome) {
                resultDiv.innerHTML = 'Por favor, insira um nome válido.';
                return;
            }
            const primeiraLetra = nome.charAt(0);
            const ultimaLetra = nome.charAt(nome.length - 1);
            const daPrimeiraAteTerceira = nome.substring(0, 3);
            const todasMenosAPrimeira = nome.substring(1);
            const duasUltimasLetras = nome.slice(-2);
            const nomesSeparados = nome.split(' ');

            resultDiv.innerHTML = `
        <strong>Todo o nome:</strong> ${nome}<br><br>
        <strong>Primeira letra do nome:</strong> ${primeiraLetra}<br><br>
        <strong>Última letra do nome:</strong> ${ultimaLetra}<br><br>
        <strong>Da primeira letra até à 3ª:</strong> ${daPrimeiraAteTerceira}<br><br>
        <strong>Todas as letras menos a primeira:</strong> ${todasMenosAPrimeira}<br><br>
        <strong>Duas últimas letras:</strong> ${duasUltimasLetras}<br><br>
        <strong>Todos os nomes separados por espaços (split):</strong> ${nomesSeparados.join(' -> ')}
      `;
        }
    </script>
</body>

</html>
