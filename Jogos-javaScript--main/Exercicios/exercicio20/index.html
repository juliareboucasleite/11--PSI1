<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 20 - Conversor Euro para Dólar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 100%;
        }
        
        h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
        }
        
        button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .result {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #444;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Conversor Euro para Dólar</h1>
        <p>Digite o valor em euros:</p>
        <input type="number" id="valorEuros" placeholder="Valor em Euros" />
        <p>Digite o câmbio (1 Euro em Dólares):</p>
        <input type="number" id="cambio" placeholder="Câmbio" />
        <button onclick="converter()">Converter</button>
        <p class="result" id="resultado"></p>
    </div>

    <script>
        function converter() {
            const valorEuros = parseFloat(document.getElementById('valorEuros').value);
            const cambio = parseFloat(document.getElementById('cambio').value);
            const resultado = document.getElementById('resultado');

            if (!isNaN(valorEuros) && !isNaN(cambio) && cambio > 0) {
                const valorDolares = valorEuros * cambio;
                resultado.textContent = `Valor em Dólares: $${valorDolares.toFixed(2)}`;
            } else {
                resultado.textContent = 'Por favor, insira valores válidos.';
            }
        }
    </script>
</body>

</html>
