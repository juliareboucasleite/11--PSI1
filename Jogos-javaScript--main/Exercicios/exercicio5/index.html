<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 5 - Console</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        h1 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.5rem;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }
        
        button {
            padding: 12px 24px;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .feedback {
            margin-top: 20px;
            font-size: 1rem;
            color: #6a1b9a;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Clube de Futebol</h1>
        <input type="text" id="nome" placeholder="Digite seu nome" />
        <input type="text" id="clube" placeholder="Digite seu clube de futebol" />
        <button onclick="mostrarMensagem()">Enviar</button>
        <div class="feedback" id="feedback"></div>
    </div>

    <script>
        function mostrarMensagem() {
            const nome = document.getElementById('nome').value.trim();
            const clube = document.getElementById('clube').value.trim();

            if (nome && clube) {
                const msg = `Eu sou o ${nome} e sou adepto do ${clube}.`;
                console.log(msg);
                document.getElementById('feedback').textContent = "Mensagem enviada para o console ✔️";
            } else {
                console.log('Por favor, preencha todos os campos.');
                document.getElementById('feedback').textContent = "Preencha todos os campos.";
            }
        }
    </script>
</body>

</html>
