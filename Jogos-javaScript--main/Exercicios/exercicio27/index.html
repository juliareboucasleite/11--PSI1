<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 27 - Consumo Médio de Combustível</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 100%;
        }
        
        h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        
        label {
            font-size: 1rem;
            color: #333;
        }
        
        input[type=number] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 5px;
            box-sizing: border-box;
        }
        
        button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .result {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #444;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Consumo Médio de Combustível</h1>
        <div class="input-group">
            <label for="distancia">Distância (km):</label>
            <input type="number" id="distancia" placeholder="Ex: 250" />
        </div>
        <div class="input-group">
            <label for="combustivel">Combustível (litros):</label>
            <input type="number" id="combustivel" placeholder="Ex: 15" />
        </div>
        <button onclick="calcularConsumo()">Calcular Consumo Médio</button>
        <p class="result" id="resultado"></p>
    </div>
    <script>
        function calcularConsumo() {
            const distancia = parseFloat(document.getElementById('distancia').value);
            const combustivel = parseFloat(document.getElementById('combustivel').value);
            const resultado = document.getElementById('resultado');
            if (isNaN(distancia) || isNaN(combustivel) || combustivel === 0) {
                resultado.textContent = "Por favor, insira valores válidos.";
                return;
            }
            const consumoMedio = distancia / combustivel;
            resultado.textContent = `Consumo Médio: ${consumoMedio.toFixed(2)} km/l`;
        }
    </script>
</body>

</html>
