<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adicionar Hífen entre Números Pares</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg, #f4f4f4);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: var(--card-bg, #fff);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        
        h1 {
            margin-bottom: 20px;
            color: var(--text, #333);
        }
        
        input {
            font-size: 1rem;
            padding: 10px;
            width: 100%;
            max-width: 300px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        
        button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .message {
            margin-top: 20px;
            font-weight: bold;
            color: var(--text, #333);
            font-size: 1.1rem;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Adicionar Hífen entre Números Pares</h1>
        <input type="text" id="numero" placeholder="Insira um número maior que 1000" />
        <button onclick="adicionarHifen()">Adicionar Hífen</button>
        <div class="message" id="resultado"></div>
    </div>

    <script>
        function adicionarHifen() {
            const numero = document.getElementById('numero').value.trim();
            if (!numero || isNaN(numero) || numero.length <= 3) {
                alert("Por favor, insira um número válido maior que 1000.");
                return;
            }

            let resultado = '';
            for (let i = 0; i < numero.length; i++) {
                resultado += numero[i];
                // Se este dígito e o próximo forem pares, adiciona hífen
                if (i < numero.length - 1) {
                    const atual = parseInt(numero[i]);
                    const proximo = parseInt(numero[i + 1]);
                    if (atual % 2 === 0 && proximo % 2 === 0) {
                        resultado += '-';
                    }
                }
            }

            document.getElementById('resultado').textContent = `Resultado: ${resultado}`;
        }
    </script>
</body>

</html>
