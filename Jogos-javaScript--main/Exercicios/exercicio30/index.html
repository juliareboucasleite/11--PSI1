<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 30 - Verificação de Número</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            flex-direction: column;
        }
        
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        label {
            font-size: 1rem;
            color: #333;
            display: block;
            margin-bottom: 8px;
            text-align: left;
        }
        
        input[type=text] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        
        button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .result {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #444;
            word-break: break-word;
            text-align: left;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Verificação de Número</h1>
        <label for="inputString">Digite uma string:</label>
        <input type="text" id="inputString" placeholder="Insira um dado" />
        <button onclick="verificarNumero()">Verificar</button>
        <div class="result" id="resultado"></div>
    </div>
    <script>
        function verificarNumero() {
            const input = document.getElementById('inputString').value.trim();
            const resultado = document.getElementById('resultado');
            if (input !== '' && !isNaN(input)) {
                resultado.textContent = `O valor "${input}" é um número.`;
                resultado.style.color = 'green';
            } else {
                resultado.textContent = 'Erro: O valor digitado não é um número.';
                resultado.style.color = 'red';
            }
        }
    </script>
</body>

</html>
