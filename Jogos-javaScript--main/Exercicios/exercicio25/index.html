<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 25 - Maior Número Aleatório</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 100%;
        }
        
        h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .result {
            margin-top: 20px;
            font-size: 1rem;
            font-weight: 600;
            color: #444;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Encontrar Maior Número</h1>
        <button onclick="encontrarMaiorNumero()">Gerar e Encontrar</button>
        <p class="result" id="resultado"></p>
    </div>
    <script>
        function encontrarMaiorNumero() {
            const numeros = [];
            for (let i = 0; i < 100; i++) {
                numeros.push(Math.floor(Math.random() * 1000));
            }
            const maiorNumero = Math.max(...numeros);
            document.getElementById('resultado').innerHTML = `Números gerados:<br>${numeros.join(', ')}<br><br>Maior número: <strong>${maiorNumero}</strong>`;
        }
    </script>
</body>

</html>
