<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 22 - Calcular Valor Sem Imposto</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 100%;
        }
        
        h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        input[type=number] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
        }
        
        button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .result {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #444;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Calcular Valor Sem Imposto</h1>
        <input type="number" id="valorComImposto" placeholder="Valor com imposto" step="0.01" />
        <input type="number" id="percentagemImposto" placeholder="Percentagem do imposto" step="0.01" />
        <button onclick="calcularValorSemImposto()">Calcular</button>
        <p class="result" id="resultado"></p>
    </div>
    <script>
        function calcularValorSemImposto() {
            const valorComImposto = parseFloat(document.getElementById('valorComImposto').value);
            const percentagemImposto = parseFloat(document.getElementById('percentagemImposto').value);
            const resultado = document.getElementById('resultado');
            if (!isNaN(valorComImposto) && !isNaN(percentagemImposto) && percentagemImposto > 0) {
                const valorImposto = (valorComImposto * percentagemImposto) / (100 + percentagemImposto);
                const valorSemImposto = valorComImposto - valorImposto;
                resultado.innerHTML = `Valor sem imposto: € ${valorSemImposto.toFixed(2)}<br>Valor do imposto: € ${valorImposto.toFixed(2)}`;
            } else {
                resultado.textContent = 'Por favor, insira valores válidos.';
            }
        }
    </script>
</body>

</html>
