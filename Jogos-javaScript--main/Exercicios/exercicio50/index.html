<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Matriz de Números Aleatórios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg, #f4f4f4);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: var(--card-bg, #fff);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        
        h1 {
            margin-bottom: 20px;
            color: var(--text, #333);
        }
        
        button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        th,
        td {
            padding: 8px;
            border: 1px solid #ddd;
            text-align: center;
        }
        
        th {
            background-color: #6a1b9a;
            color: white;
        }
        
        p {
            margin-top: 20px;
            font-weight: bold;
            color: var(--text, #333);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Matriz de Números Aleatórios</h1>
        <button onclick="gerarMatriz()">Gerar Matriz</button>
        <div id="resultado"></div>
    </div>

    <script>
        function gerarMatriz() {
            const matriz = [];
            let contagem = 0;
            for (let i = 0; i < 10; i++) {
                matriz[i] = [];
                for (let j = 0; j < 10; j++) {
                    const num = Math.floor(Math.random() * 101);
                    matriz[i][j] = num;
                    if (num >= 10 && num <= 20) contagem++;
                }
            }

            const criarTabela = matriz => {
                let tabelaHTML = `<table><tr>`;
                for (let i = 0; i < matriz[0].length; i++) {
                    tabelaHTML += `<th>Col ${i}</th>`;
                }
                tabelaHTML += `</tr>`;

                for (let i = 0; i < matriz.length; i++) {
                    tabelaHTML += `<tr>`;
                    for (let j = 0; j < matriz[i].length; j++) {
                        tabelaHTML += `<td>${matriz[i][j]}</td>`;
                    }
                    tabelaHTML += `</tr>`;
                }
                tabelaHTML += `</table>`;
                return tabelaHTML;
            };

            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = criarTabela(matriz) + `<p>Quantidade de elementos entre 10 e 20: ${contagem}</p>`;
        }
    </script>
</body>

</html>
