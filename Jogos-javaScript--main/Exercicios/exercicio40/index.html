<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 40 - Controle de Horário</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-size: 1rem;
            color: #333;
        }
        
        input[type=time] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1rem;
            box-sizing: border-box;
        }
        
        button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .message {
            margin-top: 20px;
            font-weight: 600;
            font-size: 1.1rem;
            color: #444;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Controle de Horário</h1>
        <label for="entrada">Hora de Entrada (HH:mm):</label>
        <input type="time" id="entrada" />
        <label for="saida">Hora de Saída (HH:mm):</label>
        <input type="time" id="saida" />
        <button onclick="verificarHorario()">Verificar Horário</button>
        <div class="message" id="resultado"></div>
    </div>

    <script>
        function verificarHorario() {
            const entrada = document.getElementById('entrada').value;
            const saida = document.getElementById('saida').value;
            const resultadoDiv = document.getElementById('resultado');

            if (!entrada || !saida) {
                resultadoDiv.textContent = "Por favor, preencha ambas as horas.";
                resultadoDiv.style.color = "red";
                return;
            }

            if (entrada < saida) {
                resultadoDiv.textContent = "Horário de entrada e saída registrados com sucesso.";
                resultadoDiv.style.color = "green";
            } else {
                resultadoDiv.textContent = "Erro: A hora de entrada deve ser menor que a hora de saída.";
                resultadoDiv.style.color = "red";
            }
        }
    </script>
</body>

</html>
