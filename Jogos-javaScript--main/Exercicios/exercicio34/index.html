<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 34 - Esconder Email</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            flex-direction: column;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        
        input[type=email] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
        }
        
        button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .result {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #444;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <h1>Esconder Email</h1>
    <div class="container">
        <input type="email" id="emailInput" placeholder="Digite seu email" />
        <button onclick="esconderEmail()">Esconder Email</button>
        <div class="result" id="result"></div>
    </div>

    <script>
        function esconderEmail() {
            const email = document.getElementById('emailInput').value;
            const resultDiv = document.getElementById('result');

            if (email.includes('@')) {
                const partes = email.split('@');
                const nome = partes[0];
                const dominio = partes[1];

                const mostrar = Math.ceil(nome.length / 2);
                const escondido = nome.substring(0, mostrar) + '......' + '@' + dominio;

                resultDiv.textContent = `Email escondido: ${escondido}`;
            } else {
                resultDiv.textContent = 'Por favor, insira um email válido.';
            }
        }
    </script>
</body>

</html>
