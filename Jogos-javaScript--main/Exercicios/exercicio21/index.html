<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 21 - Converter para Negativo</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 100%;
        }
        
        h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        input[type=number] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
        }
        
        button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .result {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 600;
            color: #444;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Converter Número para Negativo</h1>
        <input type="number" id="numero" placeholder="Digite um número" />
        <button onclick="converterParaNegativo()">Converter</button>
        <p class="result" id="resultado"></p>
    </div>
    <script>
        function converterParaNegativo() {
            const numero = parseFloat(document.getElementById('numero').value);
            const resultado = document.getElementById('resultado');
            if (!isNaN(numero)) {
                const numeroNegativo = numero < 0 ? numero : -numero;
                resultado.textContent = `Número negativo: ${numeroNegativo}`;
            } else {
                resultado.textContent = 'Por favor, insira um número válido.';
            }
        }
    </script>
</body>

</html>
