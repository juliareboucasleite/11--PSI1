<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soma de Arrays Aleatórios</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg, #f4f4f4);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: var(--card-bg, #fff);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        
        h1 {
            margin-bottom: 20px;
            color: var(--text, #333);
        }
        
        button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        th,
        td {
            padding: 10px 15px;
            border: 1px solid #ddd;
            text-align: center;
        }
        
        th {
            background-color: #6a1b9a;
            color: white;
        }
        
        h3 {
            margin-top: 30px;
            color: var(--text, #333);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Soma de Arrays Aleatórios</h1>
        <button onclick="somarArrays()">Gerar e Somar Arrays</button>
        <div id="resultado"></div>
    </div>

    <script>
        function somarArrays() {
            const array1 = [];
            const array2 = [];
            const somaArray = [];
            for (let i = 0; i < 10; i++) {
                array1[i] = Math.floor(Math.random() * 1000) + 1;
                array2[i] = Math.floor(Math.random() * 1000) + 1;
                somaArray[i] = array1[i] + array2[i];
            }

            const criarTabela = (arr1, arr2, soma) => {
                let tabelaHTML = `<h3>Array 1, Array 2 e Soma</h3><table><tr><th>Índice</th><th>Array 1</th><th>Array 2</th><th>Soma</th></tr>`;
                for (let i = 0; i < arr1.length; i++) {
                    tabelaHTML += `<tr><td>${i}</td><td>${arr1[i]}</td><td>${arr2[i]}</td><td>${soma[i]}</td></tr>`;
                }
                tabelaHTML += `</table>`;
                return tabelaHTML;
            };

            const resultadoDiv = document.getElementById('resultado');
            resultadoDiv.innerHTML = criarTabela(array1, array2, somaArray);
        }
    </script>
</body>

</html>
