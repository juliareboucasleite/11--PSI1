<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 12 - Verificar Maior Número</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 460px;
            width: 90%;
        }
        
        h1 {
            font-size: 1.6rem;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        input[type="number"] {
            padding: 12px;
            font-size: 1rem;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 100%;
        }
        
        button {
            padding: 12px 24px;
            font-size: 1rem;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .result {
            margin-top: 25px;
            font-size: 1.1rem;
            color: #444;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Maior Número</h1>
        <input type="number" id="numero1" placeholder="Digite o primeiro número" />
        <input type="number" id="numero2" placeholder="Digite o segundo número" />
        <button onclick="verificarMaior()">Verificar</button>
        <p class="result" id="resultado"></p>
    </div>

    <script>
        function verificarMaior() {
            const numero1 = parseFloat(document.getElementById('numero1').value);
            const numero2 = parseFloat(document.getElementById('numero2').value);
            const resultado = document.getElementById('resultado');

            if (isNaN(numero1) || isNaN(numero2)) {
                resultado.innerHTML = 'Por favor, digite números válidos.';
            } else if (numero1 > numero2) {
                resultado.innerHTML = `O maior número é: <strong>${numero1}</strong>`;
            } else if (numero2 > numero1) {
                resultado.innerHTML = `O maior número é: <strong>${numero2}</strong>`;
            } else {
                resultado.innerHTML = 'Ambos os números são <strong>iguais</strong>.';
            }
        }
    </script>
</body>

</html>
