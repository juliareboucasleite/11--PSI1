<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 10 - Mostrar URL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #f4f4f4, #ffffff);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 90%;
        }
        
        h1 {
            font-size: 1.6rem;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        
        button {
            padding: 14px 28px;
            font-size: 1.2rem;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .resultado {
            margin-top: 25px;
            font-size: 1rem;
            color: #444;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Mostrar URL da Página</h1>
        <button onclick="mostrarURL()">Clique para ver</button>
        <p class="resultado" id="resultado"></p>
    </div>

    <script>
        function mostrarURL() {
            let url;
            try {
                url = window.parent.location.href;
            } catch (e) {
                url = window.location.href + " (iframe local)";
            }

            document.getElementById("resultado").innerText = "Endereço detectado:\n" + url;
        }
    </script>
</body>

</html>
