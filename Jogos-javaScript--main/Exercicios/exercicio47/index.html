<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Número Mais Frequente</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg, #f4f4f4);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: var(--card-bg, #fff);
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        
        h1 {
            margin-bottom: 20px;
            color: var(--text, #333);
        }
        
        button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .result {
            margin-top: 25px;
            font-weight: bold;
            color: var(--text, #333);
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Número Mais Frequente</h1>
        <button onclick="encontrarNumeroFrequente()">Encontrar Número Frequente</button>
        <div class="result" id="resultado"></div>
    </div>

    <script>
        function encontrarNumeroFrequente() {
            const numeros = [];
            const contagem = {};
            for (let i = 0; i < 100; i++) {
                const numero = Math.floor(Math.random() * 1001);
                numeros.push(numero);
                contagem[numero] = (contagem[numero] || 0) + 1;
            }
            let maxContagem = 0;
            let numeroMaisFrequente = null;
            for (const numero in contagem) {
                if (contagem[numero] > maxContagem) {
                    maxContagem = contagem[numero];
                    numeroMaisFrequente = numero;
                }
            }
            document.getElementById('resultado').innerHTML = `Número gerado mais frequente: <strong>${numeroMaisFrequente}</strong> (ocorreu ${maxContagem} vez(es))`;
        }
    </script>
</body>

</html>
