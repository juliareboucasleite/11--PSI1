<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 1 - Boas-vindas</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(120deg, #f5f5f5, #ffffff);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        
        h2 {
            margin-bottom: 20px;
            color: #333;
        }
        
        button {
            padding: 15px 30px;
            font-size: 16px;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        #mensagem {
            margin-top: 20px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #6a1b9a;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Exercício 1: Mensagem de Boas-vindas</h2>
        <button id="mostrarMensagem">Clique aqui</button>
        <div id="mensagem"></div>
    </div>

    <script>
        document.getElementById("mostrarMensagem").addEventListener("click", () => {
            document.getElementById("mensagem").innerText = "Olá, Visitante! É preciso fazer todos os exercícios para aprender!";
        });
    </script>
</body>

</html>
