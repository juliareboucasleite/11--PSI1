<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 31 - Verificação de Senha</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            flex-direction: column;
        }
        
        .frame {
            background: #fff;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 400px;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        
        .input-field {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        
        .button {
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }
        
        .button:hover {
            background-color: #8e24aa;
        }
        
        .result {
            margin-top: 15px;
            font-size: 1rem;
            color: #444;
            text-align: left;
            min-height: 1.5em;
        }
    </style>
</head>

<body>
    <h1>Exercício 31</h1>
    <div class="frame">
        <input type="password" id="password" class="input-field" placeholder="Digite a senha" />
        <input type="password" id="confirmPassword" class="input-field" placeholder="Confirme a senha" />
        <button class="button" onclick="verificarSenhas()">Verificar</button>
        <div id="resultado" class="result"></div>
    </div>

    <script>
        function verificarSenhas() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const resultadoDiv = document.getElementById('resultado');

            if (password === confirmPassword) {
                resultadoDiv.innerHTML = 'As senhas são iguais.';
                resultadoDiv.style.color = 'green';
            } else {
                resultadoDiv.innerHTML = 'Erro: As senhas não coincidem.';
                resultadoDiv.style.color = 'red';
            }
        }
    </script>
</body>

</html>
