<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício 13 - Adivinhe o Número</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #fdfdfd, #eeeeee);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 480px;
            width: 90%;
        }
        
        h1 {
            font-size: 1.6rem;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        
        p {
            font-size: 1rem;
            margin-bottom: 20px;
            color: #555;
        }
        
        input[type="number"] {
            padding: 12px;
            font-size: 1rem;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
        }
        
        button {
            padding: 12px 24px;
            font-size: 1rem;
            background-color: #6a1b9a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        
        button:hover {
            background-color: #8e24aa;
        }
        
        .result {
            margin-top: 20px;
            font-size: 1.1rem;
            color: #444;
            font-weight: 500;
        }
        
        .success {
            color: green;
        }
        
        .error {
            color: red;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Adivinhe o Número</h1>
        <p>O número gerado está entre <strong>1 e 6</strong>. Faça seu palpite:</p>
        <input type="number" id="palpite" placeholder="Digite um número (1-6)" min="1" max="6">
        <button onclick="verificarPalpite()">Verificar Palpite</button>

        <p class="result" id="resultado"></p>
        <p class="result" id="contagem"></p>
    </div>

    <script>
        let numeroAleatorio = Math.floor(Math.random() * 6) + 1;
        let palpitesCertos = 0;
        let palpitesErrados = 0;

        function verificarPalpite() {
            const palpite = parseInt(document.getElementById('palpite').value);
            const resultado = document.getElementById('resultado');
            const contagem = document.getElementById('contagem');

            if (isNaN(palpite) || palpite < 1 || palpite > 6) {
                resultado.innerHTML = 'Por favor, digite um número válido entre 1 e 6.';
                resultado.className = "result error";
                return;
            }

            if (palpite === numeroAleatorio) {
                resultado.innerHTML = `🎉 Parabéns! Você acertou! O número era <strong>${numeroAleatorio}</strong>.`;
                resultado.className = "result success";
                palpitesCertos++;
                numeroAleatorio = Math.floor(Math.random() * 6) + 1;
            } else {
                resultado.innerHTML = `❌ Errou! Dica: o número é <strong>${palpite < numeroAleatorio ? 'maior' : 'menor'}</strong>.`;
                resultado.className = "result error";
                palpitesErrados++;
            }

            contagem.innerHTML = `✔️ Acertos: <strong>${palpitesCertos}</strong> | ❌ Erros: <strong>${palpitesErrados}</strong>`;
        }
    </script>
</body>

</html>
